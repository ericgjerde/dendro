[project]
name = "dendro"
version = "0.1.0"
description = "Dendrochronology dating tool for historic timber analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "dendro contributors"}
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "opencv-python>=4.8",
    "click>=8.1",
    "requests>=2.28",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24",
    "ruff>=0.4",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
]

[project.scripts]
dendro = "dendro.cli.main:cli"
dendro-api = "dendro.api.app:run"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501 (line length) is advisory for this scientific code; bare-except style in
# the legacy modules is tolerated rather than churned in this pass.
ignore = ["E501", "E722", "E741"]
